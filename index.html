<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administradores - Sistema de Vibraciones</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <!-- Pantalla de Login -->
    <div id="login-screen" class="screen">
        <div class="login-container">
            <h1>Panel de Administradores</h1>
            <p>Inicia sesión para gestionar licencias</p>
            <form id="login-form">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" required placeholder="admin@ejemplo.com">
                </div>
                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" required placeholder="••••••••">
                </div>
                <div id="login-message" class="message"></div>
                <button type="submit" class="btn btn-primary">Iniciar Sesión</button>
            </form>
        </div>
    </div>

    <!-- Dashboard -->
    <div id="dashboard-screen" class="screen hidden">
        <header class="dashboard-header">
            <h1>Panel de Administradores</h1>
            <div class="header-actions">
                <span id="user-email" class="user-email"></span>
                <button id="logout-btn" class="btn btn-secondary">Cerrar Sesión</button>
            </div>
        </header>

        <main class="dashboard-content">
            <div class="stats-row">
                <div class="stat-card" id="stat-total-card">
                    <h3>Total Licencias</h3>
                    <p id="stat-total" class="stat-number">0</p>
                </div>
                <div class="stat-card" id="stat-active-card">
                    <h3>Activas</h3>
                    <p id="stat-active" class="stat-number">0</p>
                </div>
                <div class="stat-card" id="stat-inactive-card">
                    <h3>Inactivas</h3>
                    <p id="stat-inactive" class="stat-number">0</p>
                </div>
                <div class="stat-card infinite-stat" id="infinite-stat-card" style="display: none;">
                    <h3>Licencias Infinitas ♾️</h3>
                    <p id="stat-infinite" class="stat-number">0</p>
                </div>
            </div>

            <div class="actions-row">
                <input type="text" id="search-input" placeholder="Buscar por nombre de cliente..." class="search-input">
                <button id="create-user-btn" class="btn btn-primary">Nueva Licencia</button>
            </div>

            <div class="filter-tabs">
                <button class="filter-tab active" data-filter="infinite">Licencias Infinitas ♾️</button>
                <button class="filter-tab" data-filter="regular">Licencias Regulares</button>
            </div>

            <div class="table-container">
                <table id="users-table">
                    <thead>
                        <tr>
                            <th>Usuario</th>
                            <th>Plan</th>
                            <th>Expiración</th>
                            <th>Horario</th>
                            <th>Estado</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="users-table-body">
                        <!-- Se llena dinámicamente -->
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <!-- Modal Crear Usuario -->
    <div id="user-modal" class="modal hidden">
        <div class="modal-content">
            <h2>Nueva Licencia</h2>
            <form id="user-modal-form">
                <div class="form-group">
                    <label for="user-username">Usuario</label>
                    <input type="text" id="user-username" required placeholder="nombre_usuario">
                </div>
                <div class="form-group">
                    <label for="user-password">Contraseña</label>
                    <input type="text" id="user-password" required placeholder="contraseña">
                </div>

                <div class="form-group">
                    <label>Duración</label>
                    <div class="duration-inputs">
                        <input type="number" id="user-duration-num" value="30" min="1">
                        <select id="user-duration-unit">
                            <option value="minutos">Minutos</option>
                            <option value="horas">Horas</option>
                            <option value="días" selected>Días</option>
                            <option value="meses">Meses</option>
                        </select>
                    </div>
                    <p id="duration-preview-text" class="duration-preview">30 días</p>

                    <div class="preset-chips">
                        <button type="button" class="preset-chip" data-num="30" data-unit="días">30 días</button>
                        <button type="button" class="preset-chip" data-num="7" data-unit="días">7 días</button>
                        <button type="button" class="preset-chip" data-num="1" data-unit="meses">1 mes</button>
                        <button type="button" class="preset-chip" data-num="10" data-unit="minutos" data-schedule="true">10 min (test)</button>
                    </div>
                </div>

                <div class="form-group">
                    <label>
                        <input type="checkbox" id="user-require-schedule" checked>
                        Configurar horario de clases
                    </label>
                </div>

                <div id="schedule-group" class="schedule-group">
                    <div class="schedule-header">
                        <h3>Horario de Clases</h3>
                        <button type="button" id="clear-user-schedule" class="btn btn-small btn-secondary">Limpiar</button>
                    </div>
                    <div class="schedule-table-container">
                        <table id="user-schedule-table">
                            <thead>
                                <tr>
                                    <th>Hora</th>
                                    <th>Lun</th>
                                    <th>Mar</th>
                                    <th>Mié</th>
                                    <th>Jue</th>
                                    <th>Vie</th>
                                    <th>Sáb</th>
                                </tr>
                            </thead>
                            <tbody id="user-schedule-body">
                                <!-- Se llena dinámicamente -->
                            </tbody>
                        </table>
                    </div>
                </div>

                <div id="user-modal-message" class="message"></div>
                <div class="modal-actions">
                    <button type="button" id="cancel-user-modal" class="btn btn-secondary">Cancelar</button>
                    <button type="submit" class="btn btn-primary">Crear Usuario</button>
                </div>
            </form>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
